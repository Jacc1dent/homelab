# ============================================================
# HOMELAB NGINX
# Reverse Proxy
# Version: 0.5.0-dev
# ============================================================


# WebSocket connection handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ============================================================
# HOMELAB DASHBOARD
# ============================================================

server {
    listen 80;

    server_name
        dashboard.home.arpa
        localhost;

    root /usr/share/nginx/html;
    index index.html;


    location / {
        try_files $uri $uri/ /index.html;
    }
}


# ============================================================
# PORTAINER
# ============================================================

server {
    listen 80;

    server_name portainer.home.arpa;


    location / {

        proxy_pass http://portainer:9000;

        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;


        proxy_set_header Upgrade
            $http_upgrade;

        proxy_set_header Connection
            $connection_upgrade;

    }
}


# ============================================================
# UPTIME KUMA
# ============================================================

server {
    listen 80;

    server_name
        kuma.home.arpa;


    location / {

        proxy_pass http://uptime-kuma:3001;

        proxy_http_version 1.1;


        # Forward original request information

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;


        # Uptime Kuma requires WebSocket
        # support when reverse proxied.

        proxy_set_header Upgrade
            $http_upgrade;

        proxy_set_header Connection
            $connection_upgrade;

    }
}

