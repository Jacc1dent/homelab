services:

  nginx:
    image: nginx:alpine
    container_name: homelab-dashboard

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/homelab-server.crt:/etc/nginx/tls/homelab-server.crt:ro
      - ./tls/homelab-server.key:/etc/nginx/tls/homelab-server.key:ro

    restart: unless-stopped


  portainer:
    image: portainer/portainer-ce:lts
    container_name: homelab-portainer

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    restart: unless-stopped


  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: homelab-uptime-kuma

    volumes:
      - uptime_kuma_data:/app/data

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: homelab-prometheus

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.2
    container_name: homelab-grafana

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped

  dashboard-api:
    build:
      context: ./api

    container_name: homelab-dashboard-api

    environment:
      PORTAINER_URL: http://portainer:9000
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID}
      PROMETHEUS_URL: http://prometheus:9090

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:

  portainer_data:

  uptime_kuma_data:

  prometheus_data:

  grafana_data: